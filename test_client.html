<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisper Transcription API - Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        .upload-area.dragging {
            border-color: #764ba2;
            background: #e8ebff;
        }
        
        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .model-select {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .status.loading {
            background: #fff3cd;
            border: 1px solid #ffc107;
            display: block;
        }
        
        .status.success {
            background: #d4edda;
            border: 1px solid #28a745;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            border: 1px solid #dc3545;
            display: block;
        }
        
        .result {
            margin-top: 20px;
        }
        
        .result-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .result-section h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .transcription-text {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            line-height: 1.6;
            color: #333;
        }
        
        .meta-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .meta-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        
        .meta-label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .meta-value {
            font-weight: 600;
            color: #333;
        }
        
        .segments {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .segment {
            background: white;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-bottom: 8px;
        }
        
        .segment-time {
            font-size: 0.85em;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .segment-text {
            color: #333;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Whisper Transcription</h1>
        <p class="subtitle">Upload an audio file to transcribe it using AI</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p><strong>Click to upload</strong> or drag and drop</p>
            <p style="margin-top: 5px; color: #666; font-size: 0.9em;">
                Supported: MP3, WAV, M4A, OGG, FLAC
            </p>
            <input type="file" id="fileInput" accept="audio/*">
        </div>
        
        <div class="model-select">
            <label for="modelSelect">Select Model:</label>
            <select id="modelSelect">
                <option value="tiny">Tiny - Fastest (1GB)</option>
                <option value="base" selected>Base - Recommended (1GB)</option>
                <option value="small">Small - Better accuracy (2GB)</option>
                <option value="medium">Medium - High accuracy (5GB)</option>
                <option value="large">Large - Highest accuracy (10GB)</option>
            </select>
        </div>
        
        <button id="transcribeBtn" disabled>Select a file to transcribe</button>
        
        <div class="status" id="status"></div>
        
        <div class="result" id="result" style="display: none;">
            <div class="result-section">
                <h3>Transcription</h3>
                <div class="transcription-text" id="transcriptionText"></div>
                
                <div class="meta-info">
                    <div class="meta-item">
                        <div class="meta-label">Language</div>
                        <div class="meta-value" id="language"></div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">Processing Time</div>
                        <div class="meta-value" id="processingTime"></div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">Model Used</div>
                        <div class="meta-value" id="modelUsed"></div>
                    </div>
                </div>
            </div>
            
            <div class="result-section">
                <h3>Segments (<span id="segmentCount">0</span>)</h3>
                <div class="segments" id="segments"></div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const modelSelect = document.getElementById('modelSelect');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        
        let selectedFile = null;
        
        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // File input change
        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                transcribeBtn.disabled = false;
                transcribeBtn.textContent = `Transcribe ${selectedFile.name}`;
            }
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                selectedFile = files[0];
                fileInput.files = files;
                transcribeBtn.disabled = false;
                transcribeBtn.textContent = `Transcribe ${selectedFile.name}`;
            }
        });
        
        // Transcribe button
        transcribeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const model = modelSelect.value;
            
            // Show loading status
            showStatus('loading', `<div class="spinner"></div> Transcribing with ${model} model... This may take a few minutes.`);
            result.style.display = 'none';
            transcribeBtn.disabled = true;
            
            try {
                const formData = new FormData();
                formData.append('file', selectedFile);
                
                const response = await fetch(`${API_URL}/transcribe?model=${model}`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Transcription failed');
                }
                
                const data = await response.json();
                
                // Show success
                showStatus('success', '✅ Transcription completed successfully!');
                displayResult(data);
                transcribeBtn.disabled = false;
                
            } catch (error) {
                showStatus('error', `❌ Error: ${error.message}`);
                transcribeBtn.disabled = false;
            }
        });
        
        function showStatus(type, message) {
            status.className = `status ${type}`;
            status.innerHTML = message;
        }
        
        function displayResult(data) {
            // Show result section
            result.style.display = 'block';
            
            // Transcription text
            document.getElementById('transcriptionText').textContent = data.transcription;
            
            // Meta info
            document.getElementById('language').textContent = data.language.toUpperCase();
            document.getElementById('processingTime').textContent = `${data.processing_time}s`;
            document.getElementById('modelUsed').textContent = data.model_used;
            
            // Segments
            const segmentsContainer = document.getElementById('segments');
            document.getElementById('segmentCount').textContent = data.segments.length;
            segmentsContainer.innerHTML = '';
            
            data.segments.forEach(segment => {
                const segmentDiv = document.createElement('div');
                segmentDiv.className = 'segment';
                segmentDiv.innerHTML = `
                    <div class="segment-time">${formatTime(segment.start)} → ${formatTime(segment.end)}</div>
                    <div class="segment-text">${segment.text}</div>
                `;
                segmentsContainer.appendChild(segmentDiv);
            });
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Check API health on load
        fetch(`${API_URL}/health`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'healthy') {
                    console.log('✅ API is healthy');
                }
            })
            .catch(error => {
                showStatus('error', '❌ Cannot connect to API. Make sure the server is running on http://localhost:8000');
            });
    </script>
</body>
</html>
