[project]
name = "apitranslate"
version = "1.0.0"
description = "FastAPI service for audio transcription using OpenAI Whisper"
readme = "readme.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "openai-whisper>=20231117",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "sqlmodel>=0.0.47",
    "alembic>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "pytest-asyncio>=0.21.0",
]


[tool.uv]
package = false
constraint-dependencies = ["numba>=0.60.0", "numpy<2.4"]
